# A pod standing in for the caller's application, to prove the deployment is usable
# and not merely running.
#
# The workload API socket arrives through the CSI driver, which is how a real
# application would get it: no host mount and no sidecar. The image is replaced at
# apply time with the agent image the chart itself uses, so this never pins a
# version that can drift from the deployment.
#
# No shell: the spire-agent image is distroless, so there is no /bin/sh to run a
# script with. The chart's own test pods work around that by copying busybox in
# through an init container; here the binary is simply invoked directly, at the same
# path those tests use. `api fetch jwt` prints "token(spiffe://...)", so the SPIFFE ID
# the workload was issued is visible in the pod log without needing jq in the image.
apiVersion: v1
kind: Pod
metadata:
  name: spire-dev-workload
  labels:
    app: spire-dev-workload
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: PLACEHOLDER
      command: ["/opt/spire/bin/spire-agent"]
      args:
        - api
        - fetch
        - jwt
        - -audience
        - spire-dev-test
        - -socketPath
        - /spiffe-workload-api/spire-agent.sock
        - -timeout
        - 30s
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
