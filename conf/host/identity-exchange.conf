# spire-identity-exchange configuration for a test deployment.
#
# ${VAR} references are expanded by the exchange (-expand-env) from systemd's
# EnvironmentFile chain.
#
# The TLS listeners use the self-signed certificate that scripts/host/six.sh
# generates. The SPIFFE listeners are left off: they serve the exchange's own
# X509-SVID, which means the exchange cannot start until an entry for it exists,
# and that ordering is not worth imposing on a test deployment.
#
# Every auth plugin is disabled by default. Which credential a caller wants to
# exchange is specific to their test, so this ships a working exchange with no
# trust granted, and the identity-exchange-config input replaces this file
# wholesale for callers who need a plugin enabled. The github plugin is the usual
# choice from a GitHub Actions workflow.

name: spire-identity-exchange
logLevel: ${SIX_LOG_LEVEL}
purposeMode: ${SIX_PURPOSE_MODE}
server:
  metricsPort: ${SIX_METRICS_PORT}
  tls:
    certFile: /etc/spire/identity-exchange/${SYSTEMD_INSTANCE}/certs/server.pem
    keyFile: /etc/spire/identity-exchange/${SYSTEMD_INSTANCE}/certs/server.key
    grpc:
      enable: true
      port: ${SIX_TLS_GRPC_PORT}
    rest:
      enable: true
      port: ${SIX_TLS_REST_PORT}
  spiffe:
    grpc:
      enable: false
      port: ${SIX_SPIFFE_GRPC_PORT}
    rest:
      enable: false
      port: ${SIX_SPIFFE_REST_PORT}
spire:
  agentWorkloadSocketPath: /var/run/spire/agent/sockets/${SYSTEMD_INSTANCE}/public/api.sock
  agentDelegatedSocketPath: /var/run/spire/agent/sockets/${SYSTEMD_INSTANCE}-six/private/admin.sock
  trustDomain: ${SPIFFE_TRUST_DOMAIN}
  svidTTL: ${SIX_SVID_TTL}
auth:
  plugins:
    github:
      enabled: false
      config:
        allowedRepositories:
          - ${SIX_GITHUB_REPOSITORY}
        audiences:
          - spire-identity-exchange
