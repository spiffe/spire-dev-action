# SPIRE agent configuration for a disposable test deployment.
#
# ${VAR} references are expanded by the agent itself (-expandEnv) from systemd's
# EnvironmentFile chain; see conf/host/server.conf for the reasoning.
#
# insecure_bootstrap avoids having to distribute the trust bundle to the agent
# before it has one. That is acceptable only because the server is on this same
# throwaway host and nothing outside the job can reach it; it is not appropriate
# for any real deployment.
#
# The workload attestors are what let a caller's application be identified:
#   systemd -- selectors systemd:id:<unit>.service, for a service or for a
#              transient unit started with systemd-run.
#   unix    -- selectors unix:uid, unix:gid, unix:path, for a plain process.
#
# Those two are always on. More can be added with the workload-attestors input
# (a name, for an attestor that needs no configuration) or the
# agent-extra-plugins input (raw HCL, for one that does).
#
# The marker line inside plugins below is replaced by scripts/host/configure.sh
# with those additions, or removed entirely. It is matched as a whole line, and
# deliberately not written out here a second time: any marker-looking string left
# in an installed config is a bug.

agent {
    log_level = "${SPIRE_LOG_LEVEL}"
    trust_domain = "${SPIFFE_TRUST_DOMAIN}"
    server_address = "${SPIRE_SERVER_ADDRESS}"
    server_port = "${SPIRE_SERVER_PORT}"

    insecure_bootstrap = true

    admin_socket_path = "${SPIRE_AGENT_ADMIN_ADDRESS}"
    authorized_delegates = [@@AUTHORIZED_DELEGATES@@]
}

plugins {
    KeyManager "disk" {
        plugin_data {
            directory = "./"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    WorkloadAttestor "systemd" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
@@EXTRA_PLUGINS@@
}

# No health_checks listener; see conf/host/server.conf for why.
