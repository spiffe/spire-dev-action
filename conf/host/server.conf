# SPIRE server configuration for a disposable test deployment.
#
# ${VAR} references are NOT expanded when this file is installed. The server is
# started with -expandEnv and systemd supplies the values through its
# EnvironmentFile chain, so the trust domain and ports have exactly one source of
# truth and this file stays readable in the run logs.
#
# A faithful superset of the package default at
# spire-examples/examples/systemd/conf/server/default.conf: sqlite datastore,
# on-disk key manager and the join_token node attestor, which is what makes an
# agent able to attest on a single throwaway host with no cloud metadata.
#
# The marker line inside plugins below is replaced by scripts/host/configure.sh
# with whatever plugins the enabled optional components need, or removed entirely.
# It is matched as a whole line, and deliberately not written out here a second
# time: any marker-looking string left in an installed config is a bug.

server {
    bind_address = "${SPIRE_BIND_ADDRESS}"
    bind_port = "${SPIRE_BIND_PORT}"
    trust_domain = "${SPIFFE_TRUST_DOMAIN}"
    jwt_issuer = "${SPIRE_JWT_ISSUER}"
    log_level = "${SPIRE_LOG_LEVEL}"

    # Short-lived by test standards but long enough that nothing rotates
    # mid-test; a job that outlives these is not what this action is for.
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "./datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "./keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
@@EXTRA_PLUGINS@@
}

# No health_checks listener on purpose: `spire-server healthcheck -socketPath`
# works over the API socket, so an extra HTTP port would only risk colliding
# with a port the caller's application wants.
