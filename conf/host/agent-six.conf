# Second SPIRE agent instance, used only by spire-identity-exchange.
#
# spire-identity-exchange needs two sockets: the workload API of the primary
# agent, to get its own SVID, and a delegated identity API that it uses to mint
# SVIDs for the callers it authenticates. Those cannot be the same agent, because
# the delegated API is a privileged capability that the caller's own application
# must not be granted. Hence a second instance whose admin socket is authorized
# for the exchange alone.
#
# It attests with x509pop in SPIFFE mode: it presents the X509-SVID it obtains
# from the primary agent's workload API instead of a static keypair. The server
# side of this is configured by scripts/host/configure.sh, and the entry that
# lets it obtain that SVID is created by scripts/host/six.sh.
#
# insecure_bootstrap, same as the primary agent, and for the same reason: the
# server is on this throwaway host and nothing outside the job can reach it.
#
# spire-identity-exchange's own integration tests instead point this agent at a
# trust bundle served by spire-server-attestor-spiffe-workload-api and set
# rebootstrap_mode = "always". That is deliberately not reproduced here. It exists
# to recover an agent whose server has rotated its CA underneath it, which cannot
# happen inside a job that lasts minutes, and it costs an extra package, an extra
# unit and an extra bootstrap entry to keep working. Two different bootstrap paths
# for two agents on the same host would be harder to reason about than one.
#
# ${VAR} references are expanded by the agent (-expandEnv) from systemd's
# EnvironmentFile chain.

agent {
    log_level = "${SPIRE_LOG_LEVEL}"
    trust_domain = "${SPIFFE_TRUST_DOMAIN}"
    server_address = "${SPIRE_SERVER_ADDRESS}"
    server_port = "${SPIRE_SERVER_PORT}"

    insecure_bootstrap = true

    admin_socket_path = "${SPIRE_AGENT_ADMIN_ADDRESS}"
    authorized_delegates = ["spiffe://${SPIFFE_TRUST_DOMAIN}/service/spire-identity-exchange"]
}

plugins {
    KeyManager "disk" {
        plugin_data {
            directory = "./"
        }
    }

    # Presents the SVID this instance holds from the primary agent, rather than a
    # static keypair, as its proof of possession.
    NodeAttestor "x509pop" {
        plugin_data {
            spiffe_endpoint_socket = "unix://${SPIRE_DEV_PRIMARY_AGENT_SOCKET}"
        }
    }

    WorkloadAttestor "systemd" {
        plugin_data {}
    }
}
