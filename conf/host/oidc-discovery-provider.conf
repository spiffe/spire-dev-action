# SPIFFE OIDC Discovery Provider, serving the JWKS and OIDC discovery document
# for JWT-SVIDs issued by this server.
#
# Useful when something outside SPIRE has to verify a JWT-SVID: a mock cloud IAM,
# a kube-apiserver, or the caller's own test double. A workload that just needs an
# SVID does not need this and can talk to the agent's workload API directly.
#
# ${VAR} references are expanded by the provider itself (-expandEnv), fed from
# systemd's EnvironmentFile chain.
#
# insecure_addr serves plain HTTP, which is what makes this reachable without the
# caller having to trust a certificate. It is the documented alternative to the
# acme and serving_cert_file sections, one of which a real deployment would use.

log_level = "${SPIRE_LOG_LEVEL}"

domains = [
    "localhost",
    "127.0.0.1",
    "${SPIFFE_TRUST_DOMAIN}",
    "oidc-discovery-provider.${SPIFFE_TRUST_DOMAIN}",
]

insecure_addr = "${SPIRE_OIDC_ADDR}"

# Keys are read from the server's own API rather than the agent's workload API,
# so the provider needs no registration entry of its own and can start before any
# entries exist. Only the unix name system is supported for this address.
server_api {
    address = "unix://${SPIRE_SERVER_PRIVATE_SOCKET}"
}
