# spire-controller-manager in static manifest mode: no Kubernetes involved.
#
# The controller-manager reads ClusterStaticEntry documents from a directory and
# creates the corresponding registration entries against the server's socket.
# That is what makes the controller-manager usable on a raw unix host, and it is
# why this action can offer the same entry format in both modes.
#
# This action ships its own config rather than relying on the package default so
# that staticManifestPath and the socket path are pinned to the instance the
# action deployed, independent of what a future package revision defaults to.
#
# expandEnvStaticManifests lets the manifests themselves reference
# ${SPIFFE_TRUST_DOMAIN}, so entries do not have to be re-rendered to change the
# trust domain.
#
# watchClassless is required: the manifests this action generates carry no
# className, and without this they would be ignored.

apiVersion: spire.spiffe.io/v1alpha1
kind: ControllerManagerConfig
metadata:
  name: config
metrics:
  bindAddress: ${METRICS_BIND_ADDRESS}
health:
  healthProbeBindAddress: ${HEALTH_PROBE_BIND_ADDRESS}
trustDomain: "${SPIFFE_TRUST_DOMAIN}"
clusterName: "spire-dev-${SYSTEMD_INSTANCE}"
entryIDPrefix: "spire-dev-${SYSTEMD_INSTANCE}"
clusterDomain: local
watchClassless: true
spireServerSocketPath: "/run/spire/server/sockets/${SYSTEMD_INSTANCE}/private/api.sock"
staticManifestPath: "/etc/spire/server/${SYSTEMD_INSTANCE}/manifests"
expandEnvStaticManifests: true
logLevel: info
